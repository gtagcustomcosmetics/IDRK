<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">

const $=id=>document.getElementById(id), V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const R=0.55, RH=0.1, GRAV=9.8, MAXV=12, SENS=0.005, LOOK=0.0025, PI=Math.PI;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fd3f5);scene.fog=new THREE.Fog(0x9fd3f5,70,230);
scene.add(new THREE.HemisphereLight(0xffffff,0x6a8a4a,1.2));

addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});

// ---------- load assets ----------
let mapGltf,playerGltf;
try{
  const L=new GLTFLoader();

  throw e;
}

// ---------- map + heightfield ----------
function groundTexture(){
  const S=512,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');
  x.fillStyle='#6a9a47';x.fillRect(0,0,S,S);
  const rnd=(a,b)=>a+Math.random()*(b-a),wrap=f=>{for(const dx of[-S,0,S])for(const dy of[-S,0,S])f(dx,dy)};
  for(let i=0;i<45;i++){const px=rnd(0,S),py=rnd(0,S),r=rnd(30,90),col=Math.random()<.5?'rgba(150,190,80,.10)':'rgba(40,90,40,.10)';
    wrap((dx,dy)=>{x.fillStyle=col;x.beginPath();x.arc(px+dx,py+dy,r,0,7);x.fill()})}
  for(let i=0;i<14000;i++){const px=rnd(0,S),py=rnd(0,S),l=rnd(3,9),a=rnd(-.5,.5)-1.57,h=rnd(75,115),li=rnd(28,52);
    x.strokeStyle=`hsl(${h},50%,${li}%)`;x.lineWidth=rnd(.7,1.6);
    wrap((dx,dy)=>{x.beginPath();x.moveTo(px+dx,py+dy);x.lineTo(px+dx+Math.cos(a)*l,py+dy+Math.sin(a)*l);x.stroke()})}
  for(let i=0;i<300;i++){const px=rnd(0,S),py=rnd(0,S);x.fillStyle=Math.random()<.5?'rgba(255,240,150,.7)':'rgba(255,255,255,.6)';
    wrap((dx,dy)=>x.fillRect(px+dx,py+dy,2,2))}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;
}
scene.add(mapGltf.scene);mapGltf.scene.updateMatrixWorld(true);
let hf,N,minX,minZ,step;
mapGltf.scene.traverse(o=>{if(!o.isMesh)return;
  const g=o.geometry;g.computeVertexNormals();o.material.flatShading=false;o.material.needsUpdate=true;
  const p=g.attributes.position,v=V(),pts=[],uv=new Float32Array(p.count*2);let mx=1e9,mz=1e9,Mx=-1e9;
  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i).applyMatrix4(o.matrixWorld);pts.push(v.x,v.y,v.z);uv[i*2]=v.x/8;uv[i*2+1]=v.z/8;mx=Math.min(mx,v.x);mz=Math.min(mz,v.z);Mx=Math.max(Mx,v.x)}
  g.setAttribute('uv',new THREE.BufferAttribute(uv,2));o.material.map=groundTexture();o.material.color.set(0xffffff);o.material.needsUpdate=true;
  N=Math.round(Math.sqrt(p.count));minX=mx;minZ=mz;step=(Mx-mx)/(N-1);hf=new Float32Array(N*N);
  for(let i=0;i<pts.length;i+=3){const ix=Math.round((pts[i]-minX)/step),iz=Math.round((pts[i+2]-minZ)/step);hf[iz*N+ix]=pts[i+1]}
});
function hgt(x,z){
  const fx=Math.min(Math.max((x-minX)/step,0),N-1.001),fz=Math.min(Math.max((z-minZ)/step,0),N-1.001);
  const ix=fx|0,iz=fz|0,tx=fx-ix,tz=fz-iz,a=hf[iz*N+ix],b=hf[iz*N+ix+1],c=hf[(iz+1)*N+ix],d=hf[(iz+1)*N+ix+1];
  return (a*(1-tx)+b*tx)*(1-tz)+(c*(1-tx)+d*tx)*tz;
}

// ---------- mirror (stands in front of the spawn point, facing it) ----------
{
  const mx=0,mz=-3.5,base=Math.min(hgt(mx-1.5,mz),hgt(mx,mz),hgt(mx+1.5,mz));
  const mir=new Reflector(new THREE.PlaneGeometry(3,2.2),{clipBias:0.003,textureWidth:1024,textureHeight:768,color:0xdddddd});
  mir.position.set(mx,base+1.4,mz);scene.add(mir);
  const fr=new THREE.Mesh(new THREE.BoxGeometry(3.3,2.9,0.12),new THREE.MeshStandardMaterial({color:0x5a3a1e,roughness:0.8}));
  fr.position.set(mx,base+1.15,mz-0.07);scene.add(fr);
}
// ---------- gorilla rig (arm bones aimed at a target direction) ----------
function makeGorilla(){
  const group=new THREE.Group(),model=clone(playerGltf.scene);group.add(model);scene.add(group);
  const rig={upper:[],lower:[],wrist:[],sh:[],len:[],lu:[],ll:[]};
  model.traverse(o=>{if(o.isMesh||o.isSkinnedMesh)o.frustumCulled=false;
    const n=o.name.replace(/[\s_]/g,'');
    if(n.startsWith('UpperArmL'))rig.upper[0]=o;if(n.startsWith('UpperArmR'))rig.upper[1]=o;
    if(o.isBone&&/^Head/.test(n))rig.head=o;
    if(n.startsWith('LowerArmL'))rig.lower[0]=o;if(n.startsWith('LowerArmR'))rig.lower[1]=o;
    if(n.startsWith('WristL'))rig.wrist[0]=o;if(n.startsWith('WristR'))rig.wrist[1]=o;});
  group.updateMatrixWorld(true);
  for(let k=0;k<2;k++){const s=rig.upper[k].getWorldPosition(V()),w=rig.wrist[k].getWorldPosition(V());rig.sh[k]=s;rig.len[k]=s.distanceTo(w);const l=rig.lower[k].getWorldPosition(V());rig.lu[k]=s.distanceTo(l);rig.ll[k]=l.distanceTo(w)}
  return {group,rig};
}
const _S=V(),_W=V(),_C=V(),_D=V(),_q=new THREE.Quaternion(),_Qw=new THREE.Quaternion(),_Pq=new THREE.Quaternion();
// arm direction in gorilla-local space: a = swing forward(+)/back(-), b = swing outward
function armDir(k,a,b,out){const s=k?-1:1;return out.set(s*Math.sin(b)*Math.cos(a),-Math.cos(b)*Math.cos(a),Math.sin(a)).normalize()}
function armOffset(g,k,a,b,out){return out.copy(armDir(k,a,b,_D)).multiplyScalar(g.rig.len[k]).add(g.rig.sh[k])}
function aim(g,k,a,b){
  const up=g.rig.upper[k];g.group.updateMatrixWorld(true);
  up.getWorldPosition(_S);g.rig.wrist[k].getWorldPosition(_W);_C.subVectors(_W,_S).normalize();
  armDir(k,a,b,_D).applyQuaternion(g.group.quaternion);
  _q.setFromUnitVectors(_C,_D);up.getWorldQuaternion(_Qw);up.parent.getWorldQuaternion(_Pq);
  up.quaternion.copy(_Pq.invert().multiply(_q.multiply(_Qw)));
}

const _eu=new THREE.Euler();
function aimAt(g,k,tp){
  const up=g.rig.upper[k];up.scale.set(1,1,1);g.group.updateMatrixWorld(true);
  up.getWorldPosition(_S);g.rig.wrist[k].getWorldPosition(_W);_C.subVectors(_W,_S).normalize();
  _D.subVectors(tp,_S);const d=_D.length();_D.normalize();
  _q.setFromUnitVectors(_C,_D);up.getWorldQuaternion(_Qw);up.parent.getWorldQuaternion(_Pq);
  up.quaternion.copy(_Pq.invert().multiply(_q.multiply(_Qw)));
  up.scale.y=Math.min(1.7,Math.max(0.6,d/g.rig.len[k]));
}
// 2-bone IK: shoulder -> elbow -> wrist reaches T, elbow bends toward `pole`; arm stretches a bit if T is too far
const _u=V(),_ep=V(),_roll=new THREE.Quaternion(),_wq=new THREE.Quaternion();
function aimBone(b,c,tp){
  b.updateWorldMatrix(true,true);b.getWorldPosition(_S);c.getWorldPosition(_W);
  _C.subVectors(_W,_S).normalize();_D.subVectors(tp,_S).normalize();
  _q.setFromUnitVectors(_C,_D);b.getWorldQuaternion(_Qw);b.parent.getWorldQuaternion(_Pq);
  b.quaternion.copy(_Pq.invert().multiply(_q.multiply(_Qw)));
}
function ik(g,k,T,pole){
  const r=g.rig,U=r.upper[k];U.scale.setScalar(1);g.group.updateMatrixWorld(true);
  const S=U.getWorldPosition(V()),d=S.distanceTo(T),f=Math.min(1.5,Math.max(1,d/(r.lu[k]+r.ll[k]))),a=r.lu[k]*f,b=r.ll[k]*f;
  const dd=Math.min(Math.max(d,Math.abs(a-b)+1e-3),a+b-1e-3);
  _u.subVectors(T,S).normalize();
  const x=(a*a-b*b+dd*dd)/(2*dd),hh=Math.sqrt(Math.max(0,a*a-x*x));
  _ep.copy(pole).addScaledVector(_u,-pole.dot(_u));if(_ep.lengthSq()<1e-6)_ep.set(0,-1,0);_ep.normalize();
  const E=S.clone().addScaledVector(_u,x).addScaledVector(_ep,hh);
  U.scale.setScalar(f);aimBone(U,r.lower[k],E);aimBone(r.lower[k],r.wrist[k],T);
}
// hand/wrist rotation follows the controller (tune HAND_TILT / HAND_ROLL if the hands look rotated wrong)
const HAND_TILT=-0.5,HAND_ROLL=0;
const qAl=new THREE.Quaternion().setFromUnitVectors(V(0,1,0),V(0,0,-1)),qTl=new THREE.Quaternion().setFromAxisAngle(V(1,0,0),HAND_TILT);
function handRot(g,k,cq){
  const wr=g.rig.wrist[k];
  _wq.copy(cq).multiply(qTl).multiply(qAl).multiply(_roll.setFromAxisAngle(V(0,1,0),k?-HAND_ROLL:HAND_ROLL));
  wr.parent.getWorldQuaternion(_Pq);wr.quaternion.copy(_Pq.invert().multiply(_wq));
}
// ---------- player ----------
const P={g:makeGorilla(),pos:V(),vel:V(),yaw:0,pitch:0,a:[0,0],b:[.15,.15],prev:[V(),V()],touch:[false,false],hist:[],third:false,was:false,netHands:null};
function reset(){P.pos.set(0,0,0);P.pos.y=hgt(0,0)+R+0.2;P.vel.set(0,0,0);P.hist=[];
  for(let k=0;k<2;k++)armOffset(P.g,k,P.a[k],P.b[k],P.prev[k])}
reset();

// ---------- cosmetics: hats (procedural, attached to the head bone) ----------
const COLS=[0xc0392b,0x2980b9,0x27ae60,0xf1c40f,0x8e44ad,0xf2f2f2,0x2b2b2b,0xe67e22];
const MT=(c,r=0.7)=>new THREE.MeshStandardMaterial({color:c,roughness:r,side:THREE.DoubleSide});
const cyl=(a,b,h,m,seg=24,open=false)=>new THREE.Mesh(new THREE.CylinderGeometry(a,b,h,seg,1,open),m);
const ball=(r,m)=>new THREE.Mesh(new THREE.SphereGeometry(r,16,12),m);
const dome=(r,m)=>new THREE.Mesh(new THREE.SphereGeometry(r,20,12,0,PI*2,0,PI/2),m);
const at=(o,x,y,z)=>{o.position.set(x,y,z);return o};
const hatDefs=[
 ['None',null],
 ['Top Hat',m=>{const g=new THREE.Group();g.add(at(cyl(.115,.115,.2,m),0,.1,0),at(cyl(.19,.19,.015,m),0,.008,0),at(cyl(.118,.118,.04,MT(0x111111)),0,.04,0));return g}],
 ['Cowboy',m=>{const g=new THREE.Group();g.add(at(cyl(.27,.27,.012,m),0,.006,0),at(cyl(.08,.115,.14,m),0,.08,0),at(cyl(.117,.117,.025,MT(0x5a3a1e)),0,.03,0));return g}],
 ['Beanie',m=>{const g=new THREE.Group();g.add(at(dome(.15,m),0,-.02,0),at(cyl(.152,.152,.035,MT(0xffffff)),0,-.01,0),at(ball(.04,MT(0xffffff)),0,.13,0));return g}],
 ['Party',m=>{const g=new THREE.Group();g.add(at(new THREE.Mesh(new THREE.ConeGeometry(.11,.3,20),m),0,.15,0),at(ball(.03,MT(0xf1c40f)),0,.31,0));return g}],
 ['Crown',m=>{const g=new THREE.Group();g.add(at(cyl(.13,.13,.07,m,24,true),0,.035,0));
   for(let i=0;i<6;i++){const a=i/6*PI*2;g.add(at(new THREE.Mesh(new THREE.ConeGeometry(.025,.07,8),m),Math.cos(a)*.13,.1,Math.sin(a)*.13))}return g}],
 ['Propeller',m=>{const g=new THREE.Group(),sp=new THREE.Group();
   sp.add(new THREE.Mesh(new THREE.BoxGeometry(.24,.004,.035),MT(0xc0392b)),new THREE.Mesh(new THREE.BoxGeometry(.035,.004,.24),MT(0x2980b9)));
   g.add(at(dome(.14,m),0,-.01,0),at(cyl(.008,.008,.04,MT(0x333333)),0,.14,0),at(sp,0,.165,0));g.userData.spin=sp;return g}],
 ['Wizard',m=>{const g=new THREE.Group();g.add(at(cyl(.24,.24,.01,m),0,.005,0),at(new THREE.Mesh(new THREE.ConeGeometry(.14,.45,24),m),0,.235,0),at(cyl(.141,.141,.03,MT(0xf1c40f)),0,.03,0));return g}],
 ['Santa',m=>{const g=new THREE.Group(),t=new THREE.Group();t.rotation.x=-.45;
   t.add(at(new THREE.Mesh(new THREE.ConeGeometry(.13,.3,20),m),0,.15,0),at(ball(.035,MT(0xffffff)),0,.3,0));
   g.add(t,at(cyl(.14,.14,.045,MT(0xffffff)),0,.01,0));return g}],
 ['Cat Ears',m=>{const g=new THREE.Group();for(const sx of[-1,1]){const e=at(new THREE.Mesh(new THREE.ConeGeometry(.05,.11,4),m),sx*.09,.04,0);e.rotation.z=-sx*.25;
   const i=at(new THREE.Mesh(new THREE.ConeGeometry(.028,.07,4),MT(0xffb3c6)),sx*.09,.035,.012);i.rotation.z=-sx*.25;g.add(e,i)}return g}]
];
const cos={hat:0,col:0};let hatObj=null,hatSpin=null;
try{const sv=JSON.parse(localStorage.getItem('monkeCos')||'{}');if(sv.hat>=0&&sv.hat<hatDefs.length)cos.hat=sv.hat|0;if(sv.col>=0&&sv.col<COLS.length)cos.col=sv.col|0}catch(e){}
const cosEl=document.createElement('div');cosEl.id='cos';
cosEl.innerHTML='<b>Wardrobe</b><div id="hl"></div><div id="cl"></div><small>In game: <b>H</b> next hat, <b>C</b> next color.<br>Check yourself in the mirror!<br>Click outside this box to play.</small>';
$('help').appendChild(cosEl);['click','mousedown'].forEach(ev=>cosEl.addEventListener(ev,e=>e.stopPropagation()));
hatDefs.forEach((h,i)=>{const b=document.createElement('button');b.textContent=h[0];b.onclick=()=>{cos.hat=i;wearHat()};$('hl').appendChild(b)});
COLS.forEach((c,i)=>{const d=document.createElement('span');d.className='sw';d.style.background='#'+c.toString(16).padStart(6,'0');d.onclick=()=>{cos.col=i;wearHat()};$('cl').appendChild(d)});
function wearHat(){
  if(hatObj){P.g.rig.head.remove(hatObj);hatObj=null;hatSpin=null}
  if(hatDefs[cos.hat][1]){hatObj=hatDefs[cos.hat][1](MT(COLS[cos.col]));hatSpin=hatObj.userData.spin||null;at(hatObj,0,0.285,0.03);P.g.rig.head.add(hatObj)}
  [...$('hl').children].forEach((b,i)=>b.classList.toggle('on',i===cos.hat));
  [...$('cl').children].forEach((d,i)=>d.classList.toggle('on',i===cos.col));
  try{localStorage.setItem('monkeCos',JSON.stringify(cos))}catch(e){}
}
const cycleHat=d=>{cos.hat=(cos.hat+d+hatDefs.length)%hatDefs.length;wearHat()},cycleCol=d=>{cos.col=(cos.col+d+COLS.length)%COLS.length;wearHat()};

// ---------- public multiplayer (Supabase Realtime) ----------
// Create a Supabase project, then paste its Project URL and publishable key here.
// NEVER put a secret/service_role key in a browser game.
const SUPABASE_URL='YOUR_SUPABASE_PROJECT_URL';
const SUPABASE_KEY='YOUR_SUPABASE_PUBLISHABLE_KEY';
const ROOM_COUNT=20, ROOM_CAPACITY=4, SEND_RATE_MS=66;
const playerId=(globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():('p'+Math.random().toString(36).slice(2)+Date.now().toString(36));
const playerName='Monke-'+playerId.slice(0,4).toUpperCase();
let supabaseClient=null,mpChannel=null,mpRoom='',mpReady=false,mpJoining=false,lastSend=0;
const roomProbes=[],remotePlayers=new Map();
const mpStatus=(s)=>{ $('mpStatus').textContent=s; };
function presencePlayers(ch){
  const state=ch.presenceState();
  return Object.values(state).flat().filter(p=>p&&p.playerId);
}
function netState(){
  return {
    playerId, name:playerName,
    pos:[P.pos.x,P.pos.y,P.pos.z], yaw:P.yaw, pitch:P.pitch,
    a:P.a.slice(), b:P.b.slice(),
    hands:P.netHands ? P.netHands.map(v=>v&&v.slice()) : null,
    hat:cos.hat, col:cos.col, third:!!P.third,
    sentAt:Date.now()
  };
}
function updatePlayerCount(){
  if(!mpChannel){ $('mpPlayers').textContent='Players: 1/4'; return; }
  const count=Math.min(ROOM_CAPACITY,Math.max(1,presencePlayers(mpChannel).length));
  $('mpPlayers').textContent=`Players: ${count}/${ROOM_CAPACITY}${mpRoom?' · '+mpRoom.replace('monke-public-','Room '):''}`;
}
function createRemote(state){
  if(!state||!state.playerId||state.playerId===playerId)return null;
  let r=remotePlayers.get(state.playerId);
  if(!r){
    const g=makeGorilla();
    r={id:state.playerId,g,targetPos:V(),yaw:0,pitch:0,a:[0,0],b:[.15,.15],hands:null,hat:-1,col:-1,hatObj:null,hatSpin:null};
    r.targetPos.set(0,hgt(0,0)+R+0.2,0);
    remotePlayers.set(r.id,r);
  }
  applyRemoteState(state);
  return r;
}
function applyRemoteState(s){
  if(!s||!s.playerId||s.playerId===playerId||!Array.isArray(s.pos))return;
  let r=remotePlayers.get(s.playerId);
  if(!r){
    const g=makeGorilla();
    r={id:s.playerId,g,targetPos:V(),yaw:0,pitch:0,a:[0,0],b:[.15,.15],hands:null,hat:-1,col:-1,hatObj:null,hatSpin:null};
    remotePlayers.set(r.id,r);
  }
  r.targetPos.set(Number(s.pos[0])||0,Number(s.pos[1])||0,Number(s.pos[2])||0);
  r.yaw=Number(s.yaw)||0; r.pitch=Number(s.pitch)||0;
  if(Array.isArray(s.a))r.a=s.a.slice(0,2).map(n=>Number(n)||0);
  if(Array.isArray(s.b))r.b=s.b.slice(0,2).map(n=>Number(n)||0);
  r.hands=Array.isArray(s.hands)?s.hands:null;
  if(Number.isInteger(s.hat)&&Number.isInteger(s.col)&&(r.hat!==s.hat||r.col!==s.col)){
    r.hat=s.hat; r.col=s.col;
    if(r.hatObj&&r.g.rig.head)r.g.rig.head.remove(r.hatObj);
    r.hatObj=null;r.hatSpin=null;
    const def=hatDefs[Math.max(0,Math.min(hatDefs.length-1,r.hat))];
    if(def&&def[1]&&r.g.rig.head){
      r.hatObj=def[1](MT(COLS[(r.col+COLS.length)%COLS.length]));
      r.hatSpin=r.hatObj.userData.spin||null;
      at(r.hatObj,0,0.285,0.03);r.g.rig.head.add(r.hatObj);
    }
  }
}
function removeRemote(id){
  const r=remotePlayers.get(id); if(!r)return;
  scene.remove(r.g.group);remotePlayers.delete(id);
}
function roomSync(ch){
  if(ch!==mpChannel)return;
  const state=ch.presenceState(),seen=new Set();
  for(const list of Object.values(state)){
    for(const p of list||[]){
      if(!p||!p.playerId||p.playerId===playerId)continue;
      seen.add(p.playerId);createRemote(p);
    }
  }
  for(const id of [...remotePlayers.keys()])if(!seen.has(id))removeRemote(id);
  updatePlayerCount();
  // Resolve near-simultaneous joins deterministically if a room briefly exceeds four.
  const ids=Object.keys(state).sort();
  if(ids.length>ROOM_CAPACITY&&!ids.slice(0,ROOM_CAPACITY).includes(playerId)){
    mpStatus('Room full, finding another…');
    leaveCurrentRoom().then(()=>joinPublicRoom());
  }
}
async function leaveCurrentRoom(){
  mpReady=false;
  const old=mpChannel;mpChannel=null;mpRoom='';
  if(old){try{await old.untrack()}catch(e){};try{await supabaseClient.removeChannel(old)}catch(e){}}
  for(const id of [...remotePlayers.keys()])removeRemote(id);
  updatePlayerCount();
}
async function joinPublicRoom(){
  if(mpJoining||mpReady||!supabaseClient)return;
  mpJoining=true;mpStatus('Finding a public room…');
  try{
    // Probe several public rooms. Presence is used for matchmaking; Broadcast carries movement.
    const probes=[];
    for(let i=1;i<=ROOM_COUNT;i++){
      const ch=supabaseClient.channel(`monke-public-${String(i).padStart(2,'0')}`,{
        config:{presence:{key:playerId},broadcast:{self:false}}
      });
      ch.on('presence',{event:'sync'},()=>roomSync(ch));
      ch.on('presence',{event:'join'},()=>roomSync(ch));
      ch.on('presence',{event:'leave'},()=>roomSync(ch));
      ch.on('broadcast',{event:'player-state'},({payload})=>{
        if(ch===mpChannel&&payload&&payload.playerId!==playerId)applyRemoteState(payload);
      });
      probes.push({ch,topic:`monke-public-${String(i).padStart(2,'0')}`});
    }
    const results=await Promise.all(probes.map(({ch})=>new Promise(resolve=>{
      let settled=false;
      const finish=v=>{if(!settled){settled=true;resolve(v)}};
      ch.subscribe(status=>{if(status==='SUBSCRIBED')finish(true);else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED')finish(false)});
      setTimeout(()=>finish(false),9000);
    })));
    await new Promise(r=>setTimeout(r,650));
    let chosen=null;
    for(let i=0;i<probes.length;i++){
      if(results[i]&&Object.keys(probes[i].ch.presenceState()).length<ROOM_CAPACITY){chosen=probes[i];break;}
    }
    if(!chosen){
      await Promise.all(probes.map(({ch})=>supabaseClient.removeChannel(ch)));
      mpStatus('All public rooms busy. Refresh to retry.');
      return;
    }
    mpChannel=chosen.ch;mpRoom=chosen.topic;
    // Stop probing rooms we did not join.
    await Promise.all(probes.filter(p=>p!==chosen).map(({ch})=>supabaseClient.removeChannel(ch)));
    await mpChannel.track(netState());
    mpReady=true;mpStatus('Connected to public multiplayer');
    roomSync(mpChannel);
    updatePlayerCount();
  }catch(err){
    console.error('Multiplayer connection failed:',err);
    mpStatus('Connection failed. Check setup.');
  }finally{mpJoining=false;}
}
if(SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('YOUR_')&&SUPABASE_KEY&&!SUPABASE_KEY.includes('YOUR_')){
  try{
    supabaseClient=createClient(SUPABASE_URL,SUPABASE_KEY);

}

},SEND_RATE_MS);

const key={},btn={0:false,2:false};let locked=false,msgShown=false;

addEventListener('mousemove',e=>{

// ---------- simulation ----------
const _o=V(),_p=V(),_dl=V(),disp=V(),gq=new THREE.Quaternion();
function stepPlayer(dt){
  P.netHands=null;
  const act=[btn[0]||key.KeyQ,btn[2]||key.KeyE];
  const kx=(key.ArrowRight?1:0)-(key.ArrowLeft?1:0),ky=(key.ArrowUp?1:0)-(key.ArrowDown?1:0);
  if(!act[0]&&!act[1]){P.yaw-=kx*2*dt;P.pitch=Math.max(-1.4,Math.min(1.4,P.pitch+ky*2*dt))}
  for(let k=0;k<2;k++)if(act[k]){
    P.a[k]=Math.max(-1.4,Math.min(1.6,P.a[k]+ky*5*dt));
    P.b[k]=Math.max(-0.3,Math.min(1.5,P.b[k]+kx*5*dt*(k?1:-1)));
  }
  P.g.group.rotation.y=P.yaw+PI;P.g.group.updateMatrixWorld(true);gq.copy(P.g.group.quaternion);
  for(let k=0;k<2;k++)if(!act[k]&&!P.touch[k]){P.a[k]+=(0-P.a[k])*Math.min(1,6*dt);P.b[k]+=(0.15-P.b[k])*Math.min(1,6*dt)}
  disp.set(0,0,0);let touching=false;const off=[V(),V()],ow=[V(),V()];
  for(let k=0;k<2;k++){
    armOffset(P.g,k,P.a[k],P.b[k],off[k]);ow[k].copy(off[k]).applyQuaternion(gq);
    _p.copy(P.prev[k]).applyQuaternion(gq);_dl.subVectors(ow[k],_p);
    const wx=P.pos.x+ow[k].x,wy=P.pos.y+ow[k].y,wz=P.pos.z+ow[k].z,h=hgt(wx,wz);
    if(wy-RH<h+0.03){disp.sub(_dl);touching=true;P.touch[k]=true}else P.touch[k]=false;
    P.prev[k].copy(off[k]);
  }
  if(touching){
    P.pos.add(disp);
    for(let k=0;k<2;k++)if(P.touch[k]){const wy=P.pos.y+ow[k].y,h=hgt(P.pos.x+ow[k].x,P.pos.z+ow[k].z);if(wy-RH<h)P.pos.y+=h+RH-wy}
    P.hist.push(disp.clone().divideScalar(dt));if(P.hist.length>5)P.hist.shift();
    P.vel.set(0,0,0);P.hist.forEach(v=>P.vel.add(v));P.vel.divideScalar(P.hist.length);
    if(P.vel.length()>MAXV)P.vel.setLength(MAXV);
  }else{
    if(P.was){P.vel.multiplyScalar(1.12);if(P.vel.length()>MAXV)P.vel.setLength(MAXV)}
    P.hist=[];P.vel.y-=GRAV*dt;P.pos.addScaledVector(P.vel,dt);
  }
  P.was=touching;
  const h=hgt(P.pos.x,P.pos.z);
  if(P.pos.y-R<h){P.pos.y=h+R;if(P.vel.y<0)P.vel.y=0;if(!touching){const f=Math.max(0,1-5*dt);P.vel.x*=f;P.vel.z*=f}}
  if(Math.abs(P.pos.x)>68){P.pos.x=Math.sign(P.pos.x)*68;P.vel.x=0}
  if(Math.abs(P.pos.z)>68){P.pos.z=Math.sign(P.pos.z)*68;P.vel.z=0}
  P.g.group.position.copy(P.pos);P.g.group.updateMatrixWorld(true);
  aim(P.g,0,P.a[0],P.b[0]);aim(P.g,1,P.a[1],P.b[1]);
}
// ---------- VR (WebXR): headset = body, controllers = hands ----------
const VS=1.4; // VR world scale: makes your real arms reach the ground like a gorilla's
const grips=[0,1].map(i=>{const g=renderer.xr.getControllerGrip(i);rig.add(g);return g});
const byHand=[null,null],vrPrev=[null,null],tpOff=V(),_cq=new THREE.Quaternion(),_fw=V(),_rt=V(),_pole=V();
let vrInit=false,vrBtn=false,vrStick=false,vrLS=false,vrLF=false,hudT=0,tpYaw=0,vrYaw=0,headS=1;
function setHead(sc){P.g.group.traverse(o=>{if(o.isBone&&/^Head/.test(o.name.replace(/[\s_]/g,'')))o.scale.setScalar(sc)})}
[0,1].forEach(i=>{const c=renderer.xr.getController(i);rig.add(c);
  c.addEventListener('connected',e=>{const hd=e.data.handedness==='left'?0:1;byHand[hd]={grip:grips[i],gp:e.data.gamepad};vrPrev[hd]=null});
  c.addEventListener('disconnected',()=>{for(let k=0;k<2;k++)if(byHand[k]&&byHand[k].grip===grips[i]){byHand[k]=null;vrPrev[k]=null}})});
renderer.xr.addEventListener('sessionstart',()=>{rig.scale.setScalar(VS);rig.position.set(P.pos.x,hgt(P.pos.x,P.pos.z)+0.5,P.pos.z);
  P.vel.set(0,0,0);P.hist=[];setHead(1);headS=1;tpOff.set(0,0,0);vrInit=true;$('help').style.display='none'});
renderer.xr.addEventListener('sessionend',()=>{rig.scale.setScalar(1);rig.position.set(0,0,0);rig.rotation.set(0,0,0);
  setHead(1);tpOff.set(0,0,0);[0,1].forEach(k=>P.g.rig.upper[k].scale.set(1,1,1));reset();if(!locked)$('help').style.display='flex'});
const _hd=V();
function stepVR(dt){
  rig.position.sub(tpOff);rig.updateMatrixWorld(true);const xc=renderer.xr.getCamera();
  const head=()=>rig.localToWorld(_hd.copy(xc.position));
  head();const pb=_hd.clone();pb.y-=0.5;
  if(vrInit){rig.position.y+=hgt(pb.x,pb.z)+R-pb.y;vrInit=false;rig.updateMatrixWorld(true);head();pb.copy(_hd);pb.y-=0.5}
  const hp=_hd.clone(),disp=V(),w=[null,null];let touching=false;
  for(let k=0;k<2;k++){
    P.touch[k]=false;const bh=byHand[k];if(!bh){vrPrev[k]=null;continue}
    w[k]=rig.localToWorld(bh.grip.position.clone());const ow=w[k].clone().sub(hp);
    if(!vrPrev[k])vrPrev[k]=ow.clone();
    const h=hgt(w[k].x,w[k].z);
    if(w[k].y-RH<h+0.03){disp.sub(ow.clone().sub(vrPrev[k]));touching=true;P.touch[k]=true}
    vrPrev[k].copy(ow);
  }
  const mv=V();
  if(touching){
    mv.copy(disp);
    for(let k=0;k<2;k++)if(P.touch[k]){const wy=w[k].y+mv.y,h=hgt(w[k].x+mv.x,w[k].z+mv.z);if(wy-RH<h)mv.y+=h+RH-wy}
    P.hist.push(mv.clone().divideScalar(dt));if(P.hist.length>5)P.hist.shift();
    P.vel.set(0,0,0);P.hist.forEach(v=>P.vel.add(v));P.vel.divideScalar(P.hist.length);
    if(P.vel.length()>MAXV)P.vel.setLength(MAXV);
  }else{
    if(P.was){P.vel.multiplyScalar(1.12);if(P.vel.length()>MAXV)P.vel.setLength(MAXV)}
    P.hist=[];P.vel.y-=GRAV*dt;mv.copy(P.vel).multiplyScalar(dt);
  }
  P.was=touching;
  const pn=pb.clone().add(mv),h=hgt(pn.x,pn.z);
  if(pn.y-R<h){mv.y+=h+R-pn.y;if(P.vel.y<0)P.vel.y=0;if(!touching){const f=Math.max(0,1-5*dt);P.vel.x*=f;P.vel.z*=f}}
  pn.copy(pb).add(mv);
  if(Math.abs(pn.x)>68){mv.x+=Math.sign(pn.x)*68-pn.x;P.vel.x=0}
  if(Math.abs(pn.z)>68){mv.z+=Math.sign(pn.z)*68-pn.z;P.vel.z=0}
  rig.position.add(mv);P.pos.copy(pb).add(mv);
  P.netHands=w.map(hand=>hand?hand.clone().add(mv).sub(P.pos).toArray():null);
  const gg=P.g.group;vrYaw=_eu.setFromQuaternion(xc.quaternion,'YXZ').y;P.yaw=vrYaw;
  _fw.set(-Math.sin(vrYaw),0,-Math.cos(vrYaw));_rt.set(Math.cos(vrYaw),0,-Math.sin(vrYaw));
  gg.position.copy(P.pos).addScaledVector(_fw,-0.28);gg.rotation.y=vrYaw+PI;gg.updateMatrixWorld(true);
  for(let k=0;k<2;k++)if(w[k]){
    _pole.set(0,-0.6,0).addScaledVector(_rt,k?0.6:-0.6).addScaledVector(_fw,-0.5);
    ik(P.g,k,w[k].add(mv),_pole);handRot(P.g,k,byHand[k].grip.getWorldQuaternion(_cq));
  }
  // any face button (A/B/X/Y) = respawn
  const bp=(k,i)=>{const gp=byHand[k]&&byHand[k].gp;return !!(gp&&gp.buttons[i]&&gp.buttons[i].pressed)};
  const pr=bp(1,4)||bp(1,5),lS=bp(0,3),lF=bp(0,4)||bp(0,5);
  if(lS&&!vrLS)cycleHat(1);if(lF&&!vrLF)cycleCol(1);vrLS=lS;vrLF=lF;
  if(pr&&!vrBtn){rig.position.set(0,hgt(0,0)+0.5,0);P.vel.set(0,0,0);vrInit=true}vrBtn=pr;
  const gp1=byHand[1]&&byHand[1].gp,st=!!(gp1&&gp1.buttons[3]&&gp1.buttons[3].pressed);if(st&&!vrStick)P.third=!P.third;vrStick=st;
  if(P.third){tpYaw+=Math.atan2(Math.sin(vrYaw-tpYaw),Math.cos(vrYaw-tpYaw))*Math.min(1,1.5*dt);tpOff.set(Math.sin(tpYaw)*2.4,0.7,Math.cos(tpYaw)*2.4)}
  else{tpOff.set(0,0,0);tpYaw=vrYaw}
  rig.position.add(tpOff);
}
const clock=new THREE.Clock();let t=0;
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),1/30);t+=dt;
  if(renderer.xr.isPresenting)stepVR(dt);else stepPlayer(dt);
  if(hatSpin)hatSpin.rotation.y+=dt*25;
  for(const r of remotePlayers.values()){
    r.g.group.position.lerp(r.targetPos,Math.min(1,dt*12));
    r.g.group.rotation.y=r.yaw+PI;
    r.g.group.updateMatrixWorld(true);
    if(r.hands&&r.hands.some(Boolean)){
      const fw=V(-Math.sin(r.yaw),0,-Math.cos(r.yaw)),rt=V(Math.cos(r.yaw),0,-Math.sin(r.yaw));
      for(let k=0;k<2;k++){
        if(r.hands[k]&&r.hands[k].length>=3){
          const target=r.g.group.position.clone().add(V(r.hands[k][0],r.hands[k][1],r.hands[k][2]));
          const pole=r.g.group.position.clone().add(V(0,-0.6,0)).addScaledVector(rt,k?0.6:-0.6).addScaledVector(fw,-0.5);
          ik(r.g,k,target,pole);
        }else aim(r.g,k,r.a[k]||0,r.b[k]||0);
      }
    }else{
      aim(r.g,0,r.a[0]||0,r.b[0]||0);aim(r.g,1,r.a[1]||0,r.b[1]||0);
    }
    if(r.hatSpin)r.hatSpin.rotation.y+=dt*25;
  }
  const f=V(-Math.sin(P.yaw),0,-Math.cos(P.yaw));
  if(renderer.xr.isPresenting){}
  else if(P.third){cam.position.copy(P.pos).addScaledVector(f,-3.2).add(V(0,1.4,0));cam.lookAt(P.pos)}
  else{cam.position.copy(P.g.group.localToWorld(V(0,0.5,0.28)));cam.rotation.set(P.pitch,P.yaw,0,'YXZ')}
  $('sub').textContent=`Speed: ${P.vel.length().toFixed(1)} m/s`;
  renderer.render(scene,cam);
});
